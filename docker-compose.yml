services:
  orders:
    build: ./services
    environment:
      SERVICE_NAME: orders
      DOWNSTREAM_URLS: http://payments:5000/charge,http://inventory:5000/reserve
    ports: ["5001:5000"]
    depends_on: [payments, inventory]

  payments:
    build: ./services
    environment:
      SERVICE_NAME: payments
      BASE_LATENCY_MS: "40"
    ports: ["5002:5000"]

  inventory:
    build: ./services
    environment:
      SERVICE_NAME: inventory
      BASE_LATENCY_MS: "25"
    ports: ["5003:5000"]

  loadgen:
    build: ./loadgen
    environment:
      TARGET_URL: http://orders:5000/checkout
      RPS: "8"
    depends_on: [orders]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  detector:
    build: ./detector
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      SERVICES: orders,payments,inventory
      DEPENDENCIES: "orders>payments,orders>inventory"
      DETECTOR_METHOD: both
      Z_THRESHOLD: "4.0"
    ports: ["8000:8000"]
    depends_on: [prometheus]

  dashboard:
    build: ./dashboard
    ports: ["8080:80"]
    depends_on: [detector]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
