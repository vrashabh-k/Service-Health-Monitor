global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: orders
    static_configs:
      - targets: ["orders:5000"]
  - job_name: payments
    static_configs:
      - targets: ["payments:5000"]
  - job_name: detector
    static_configs:
      - targets: ["detector:8000"]
  - job_name: inventory
    static_configs:
      - targets: ["inventory:5000"]
